[project]
name = "decision-agents"
version = "0.1.0"
description = "スタートアップ企業の意思決定を支援するマルチエージェントアプリケーション"
requires-python = ">=3.12"
dependencies = [
    "google-adk",
    "prompt-toolkit>=3.0.52",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
