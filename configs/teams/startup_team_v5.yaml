id: "startup_team_v5"
name: "スタートアップチーム(v5)"
description: "新規事業の構想するスタートアップチーム(v5)"

members:
  - id: ceo
    name: "CEO"
    prompt: |
      あなたはスタートアップ企業のCEOです。
      チーム全体の議論を統合し、各専門家の意見を踏まえて最終的な判断を下す役割を担います。

      行動指針:
      - 各メンバーの専門的な意見を尊重しつつ、全体最適の視点で意思決定を行う
      - 議論が発散した場合は論点を整理し、結論に導く
      - ビジョンと実現可能性のバランスを常に意識する
    tools: []

  - id: cmo
    name: "CMO（市場・顧客視点重視）"
    prompt: |
      あなたはスタートアップ企業のCMOです。
      市場動向や顧客ニーズの観点からアイディアを評価する役割を担います。

      行動指針:
      - ターゲット顧客は誰か、その顧客の課題は何かを常に問う
      - 市場規模、競合状況、参入障壁を分析する
      - 顧客獲得戦略やマーケティング施策の実現性を検討する
      - Google 検索ツールを活用し、最新の市場データや競合情報を調査した上で発言する
    tools: [google_search]

  - id: cfo
    name: "CFO（財務視点重視）"
    prompt: |
      あなたはスタートアップ企業のCFOです。
      財務的な観点からアイディアの実現性と持続可能性を評価する役割を担います。

      行動指針:
      - 売上モデル、コスト構造、損益分岐点を具体的に検討する
      - 必要な初期投資額と資金調達の実現性を評価する
      - キャッシュフローの観点から事業の持続可能性を判断する
    tools: []

  - id: cto
    name: "CTO（技術実現性重視）"
    prompt: |
      あなたはスタートアップ企業のCTOです。
      技術的な観点からアイディアの実現可能性を評価する役割を担います。

      行動指針:
      - 提案された事業に必要な技術要素を洗い出す
      - 技術的な実現難易度と開発期間を見積もる
      - 少人数チームで実現可能な技術スタックやアーキテクチャを提案する
    tools: []

  - id: devils_advocate
    name: "反証担当（仮説の反証担当）"
    prompt: |
      あなたはスタートアップ企業の反証担当です。
      他のメンバーが提示したアイディアや仮説に対して、意図的に反論・反証を行う役割を担います。

      行動指針:
      - 楽観的な仮説に対して、最悪のシナリオや見落とされたリスクを指摘する
      - 「なぜこのアイディアは失敗するか」という観点で検証する
      - 単なる否定ではなく、建設的な反証を通じてアイディアの強化に貢献する
      - Google 検索ツールを活用し、類似事業の失敗事例や市場データを根拠として反証する
    tools: [google_search]

steps:
  - id: step1
    name: "事業アイディアのブレインストーミング"
    members: [ceo, cmo]
    description: "楽観的に初期の事業アイディアをブレーンストーミングする"
    output: |
      事業アイディアの一覧。
      
      各事業アイディアは、以下の要素を含む。
      - アイディアの概要
      - ターゲット顧客
      - 想定する顧客課題
      - 提供するソリューション概要
      - この先５年間の売上計画
    prompt: |
      - 前半では、自由な発想でアイディアを出すことを優先し、批判は控えること。
      - 前半では、各メンバーは自身の専門的視点から可能性を広げる提案を行うこと。
      - 後半では、議論を収束させ、上記の構成要素を含む事業アイディアの一覧をアウトプットすること。
    rounds: 4
    fallback: step1

  - id: step2
    name: "売上計画の検証"
    members: [ceo, cmo, cfo]
    description: "Step 1 の結果に対して売上計画の現実性を検証"
    output: |
      改善された事業アイディアの一覧。

      各事業アイディアは、以下の要素を含む。
      - アイディアの概要
      - ターゲット顧客
      - 想定する顧客課題
      - 提供するソリューション概要
      - この先５年間の売上計画
      - 売上モデル
      - コスト構造
      - 損益分岐点の概算
    prompt: |
      - 新規参加メンバー（CFO）の専門的視点を優先的に取り入れること。
      - 各アイディアに対して具体的な数値を用いて検証する。
      - 楽観・悲観シナリオの両面を考慮すること。
      - 後半では議論を収束させ、必ずアウトプットの成果に落とし込むこと。
    rounds: 4
    fallback: [step2, step1]

  - id: step3
    name: "技術実現性検証"
    members: [ceo, cmo, cfo, cto]
    description: "Step 2 の結果に対して技術的な実現性を検証"
    output: |
      改善された事業アイディアの一覧。

      各事業アイディアは、以下の要素を含む。
      - アイディアの概要
      - ターゲット顧客
      - 想定する顧客課題
      - 提供するソリューション概要
      - この先５年間の売上計画
      - 売上モデル
      - コスト構造
      - 損益分岐点の概算
      - 技術要件
      - 開発期間見積もり
      - 技術的リスクの一覧
    prompt: |
      - 新規参加メンバー（CTO）の専門的視点を優先的に取り入れること。
      - 少人数チームで実現可能かを軸に、技術スタック・アーキテクチャ・開発優先度を議論すること。
      - 後半では議論を収束させ、必ずアウトプットの成果に落とし込むこと。
    rounds: 4
    fallback: [step3, step2]

  - id: step4
    name: "マーケティング実現性検証"
    members: [ceo, cmo, cfo, cto]
    description: "Step 3 の結果に対してマーケティングとしての実現性を検証"
    output: |
      改善された事業アイディアの一覧。

      各事業アイディアは、以下の要素を含む。
      - アイディアの概要
      - ターゲット顧客
      - 想定する顧客課題
      - 提供するソリューション概要
      - この先５年間の売上計画
      - 売上モデル
      - コスト構造
      - 損益分岐点の概算
      - 技術要件
      - 開発期間見積もり
      - 技術的リスクの一覧
      - マーケティング手法
      - マーケティング計画
    prompt: |
      - CMO（市場・顧客視点重視）の専門的視点を優先的に取り入れること。
      - 少人数チームで売上のスケジュール感と照らし合わせて、マーケティング手法や計画を重点的に考え、実現可能か議論すること。
      - 後半では議論を収束させ、必ずアウトプットの成果に落とし込むこと。
    rounds: 4
    fallback: [step4, step3]

  - id: step5
    name: "反証検証"
    members: [ceo, cmo, cfo, cto, devils_advocate]
    description: "Step 4 の結果に対して各仮説の反証に耐えうるか検証"
    output: |
      各事業アイディアの一覧をブラッシュアップしたもの。
      
      各事業アイディアは、以下の要素を含む。
      - アイディアの概要
      - ターゲット顧客
      - 想定する顧客課題
      - 提供するソリューション概要
      - この先５年間の売上計画
      - 売上モデル
      - コスト構造
      - 損益分岐点の概算
      - 技術要件
      - 開発期間見積もり
      - 技術的リスクの一覧
      - マーケティング手法
      - マーケティング計画
      - 主要リスク
      - 反論とそれに対する対策
      - 最終的な推奨アイディアの順位付け
    prompt: |
      - 新規参加メンバー（反証担当）の専門的視点を優先的に取り入れること。
      - 反証担当は意図的に反論を行い、他メンバーはそれに対して根拠をもって応答すること。
      - 感情的な議論は避け、データと論理に基づいた検証を行う。
      - 後半では議論を収束させ、必ずアウトプットの成果に落とし込むこと。
    rounds: 4
    fallback: [step5, step4]
