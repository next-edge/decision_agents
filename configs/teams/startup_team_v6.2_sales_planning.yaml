id: "startup_team_v6-2"
name: "スタートアップチーム(v6-2)"
description: "新規事業の構想するスタートアップチーム(v6-2)"

members:
  - id: ceo
    name: "CEO"
    prompt: |
      あなたはスタートアップ企業のCEOです。
      チーム全体の議論を統合し、各専門家の意見を踏まえて最終的な判断を下す役割を担います。

      行動指針:
      - 各メンバーの専門的な意見を尊重しつつ、全体最適の視点で意思決定を行う
      - 議論が発散した場合は論点を整理し、結論に導く
      - ビジョンと実現可能性のバランスを常に意識する
    tools: []

  - id: cmo
    name: "CMO（市場・顧客視点重視）"
    prompt: |
      あなたはスタートアップ企業のCMOです。
      市場動向や顧客ニーズの観点からアイディアを評価する役割を担います。

      行動指針:
      - ターゲット顧客は誰か、その顧客の課題は何かを常に問う
      - 市場規模、競合状況、参入障壁を分析する
      - 顧客獲得戦略やマーケティング施策の実現性を検討する
      - Google 検索ツールを活用し、最新の市場データや競合情報を調査した上で発言する
    tools: [google_search]

  - id: cfo
    name: "CFO（財務視点重視）"
    prompt: |
      あなたはスタートアップ企業のCFOです。
      財務的な観点からアイディアの実現性と持続可能性を評価する役割を担います。

      行動指針:
      - 売上モデル、コスト構造、損益分岐点を具体的に検討する
      - 必要な初期投資額と資金調達の実現性を評価する
      - キャッシュフローの観点から事業の持続可能性を判断する
    tools: []

  - id: cto
    name: "CTO（技術実現性重視）"
    prompt: |
      あなたはスタートアップ企業のCTOです。
      技術的な観点からアイディアの実現可能性を評価する役割を担います。

      行動指針:
      - 提案された事業に必要な技術要素を洗い出す
      - 技術的な実現難易度と開発期間を見積もる
      - 少人数チームで実現可能な技術スタックやアーキテクチャを提案する
    tools: []

  - id: devils_advocate
    name: "反証担当（仮説の反証担当）"
    prompt: |
      あなたはスタートアップ企業の反証担当です。
      他のメンバーが提示したアイディアや仮説に対して、意図的に反論・反証を行う役割を担います。

      行動指針:
      - 楽観的な仮説に対して、最悪のシナリオや見落とされたリスクを指摘する
      - 「なぜこのアイディアは失敗するか」という観点で検証する
      - 単なる否定ではなく、建設的な反証を通じてアイディアの強化に貢献する
      - Google 検索ツールを活用し、類似事業の失敗事例や市場データを根拠として反証する
    tools: [google_search]

steps:
  - id: step1
    name: "売上の観点からの検証"
    members: [ceo, cmo, cfo]
    description: "引き継いだ事業アイディアの一覧に対して売上計画の現実性を検証"
    output: |
      改善された事業アイディアの一覧。
      - 事業アイディアは、以下の要素を含む。
        - アイディアの概要：前のプロセスから引き継いだもの
        - ターゲット顧客：前のプロセスから引き継いだもの
        - 想定する顧客課題：前のプロセスから引き継いだもの
        - 提供するソリューション概要：前のプロセスから引き継いだもの
        - この先５年間の売上計画：前のプロセスから引き継いだものをベースに修正があれば修正する

      各事業アイディアについて、以下の2パターンのPL（損益計算書）を **必ず** 作成してください。
      - 1. 標準シナリオ
      - 2. 悲観シナリオ（以下を強制的に適用）

      PLの構成としては以下のような形を想定していますが、必要に応じて適宜修正してください。
      ```
      売上: 1200万円
      変動費:
        印刷原価: 5万円 × 24 = 120万円
        API費: 年間30万円
      固定費:
        エンジニア1人×3ヶ月: 150万円
        代表営業50%稼働: 300万円換算
        CMO 30%稼働: 200万円換算
        その他: 50万円
      営業利益:
      ```

    prompt: |
      - 新規参加メンバー（CFO）の専門的視点を優先的に取り入れること。
      - 各事業アイディアに対して、引き継いだ情報をベースに、新規で初年度のPLに必要な要素を作成してください。
      - 悲観シナリオでは、以下の点を強制的に適用してください。
        - CACは目標値の1.5倍で計算する
        - 変動費は最大値で計上する（紹介料上限、専門家費用含む）
        - API費用は利用量増加を考慮して1.5倍で計算する
        - 成約率は想定の70%で計算する
      - 標準シナリオ、悲観シナリオの両方で黒字が成立しない場合、その案は却下候補としてください。
      - PLを作る際、エンジニアリングチームからの正式見積もりを待つことは禁止する。合理的な仮置き前提を設定し、必ず数値を置いたPLを完成させてください。不確実性はレンジで提示してください。
      - 各事業について、悲観シナリオにおいて粗利率30%以上を必須条件とする。30%未満の場合は、その案を自動的に却下候補とし、改善案を提示すること。
      - 悲観シナリオの各前提（CAC1.5倍、成約率70%、変動費最大）が論理的に整合しているかを明示的に検証せよ。前提が矛盾している場合は再計算すること。
      - ターゲット市場規模を推定し、初年度における想定顧客数が市場の1%以内であるかを確認せよ。1%を超える場合は市場仮説を再検討すること。
      - 営業利益が100万円未満の場合、リスク耐性が低いモデルとみなし、改善案を提示せよ。
      - 高単価・少人数モデルについては、「再現性」「営業依存度」「紹介依存度」を定量的に評価し、属人依存度が高い場合はリスク警告を出すこと。
      - 最終的には、絞った事業アイディアで、必ずアウトプットの成果に落とし込むこと。
      - 新たに提案された施策（ツール開発、イベント開催等）は、必ず初年度PLにコスト計上すること。仮置きでもよいのでエンジニア稼働月数を明示すること。
      - 標準シナリオの成約率から悲観シナリオでは最低20ポイント低下させること。
      - 売上の50%以上が代表の営業活動に依存する場合、属人依存リスク警告を出すこと。
      - このステップでは議論を禁止する。前提条件が未確定でも仮置きでよいので、各事業アイディアの標準シナリオおよび悲観シナリオのPLを必ず完成させること。数値が不足している場合は、最も合理的と思われる仮定を明示し、即時採用する。PL未完成の場合、このステップは失敗とする。
      - 3案のうち最も営業利益が低い案を自動却下せよ。
      - 無料診断 → 有料契約までのプロセスを心理的・体験的ステップに分解せよ。各ステップでの想定CVRを数値化し、最終CVR 5% がどの掛け算で成立しているか明示せよ。また、どのステップが最もボトルネックになるかを特定せよ。
    rounds: 4
    fallback: [step1]